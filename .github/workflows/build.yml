name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish single-file exe
        run: dotnet publish SpaceSwipe.csproj -c Release -r ${{ matrix.rid }} -o out

      - name: Name the artifact
        shell: pwsh
        run: |
          $name = if ('${{ matrix.rid }}' -eq 'win-arm64') { 'SpaceSwipe-arm64.exe' } else { 'SpaceSwipe.exe' }
          Move-Item out/SpaceSwipe.exe $name

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceSwipe-${{ matrix.rid }}
          path: SpaceSwipe*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
